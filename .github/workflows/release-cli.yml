name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.32.1
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require tag to match release manifest
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('release/cli-release.json')).version")
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Run complete verifier
        run: bash scripts/verify-phase0.sh

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.32.1
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require native platform
        shell: bash
        run: test "$(node -p "process.platform + '-' + process.arch")" = "${{ matrix.platform }}"
      - name: Build release artifact
        run: node scripts/build-cli-release.mjs --output-dir dist
      - name: Upload native artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cli-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download native artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Aggregate and validate checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 3
          test "$(find dist -maxdepth 1 -name '*.sha256' -type f | wc -l)" -eq 3
          find dist -maxdepth 1 -name '*.sha256' -type f -exec cat {} + | LC_ALL=C sort -k2 > dist/SHA256SUMS
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - name: Gate stable releases on production health
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          case "$version" in
            *-*) exit 0 ;;
          esac
          health=$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://orgspace.tashan.chat/v1/health)
          HEALTH="$health" node -e '
            const value = JSON.parse(process.env.HEALTH);
            if (value.status !== "ok") process.exit(1);
          '
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          prerelease=()
          case "$version" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "torg $version" --generate-notes "${prerelease[@]}"
