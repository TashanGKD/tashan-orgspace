name: tashan-orgspace-local

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: orgspace
      POSTGRES_PASSWORD: ${ORGSPACE_LOCAL_POSTGRES_PASSWORD:?set ORGSPACE_LOCAL_POSTGRES_PASSWORD}
      POSTGRES_USER: orgspace
    ports:
      - "127.0.0.1:${ORGSPACE_LOCAL_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgspace -d orgspace"]
      interval: 2s
      timeout: 3s
      retries: 15
    stop_grace_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${ORGSPACE_LOCAL_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    stop_grace_period: 10s
    volumes:
      - redis-data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_API_CORS_ALLOW_ORIGIN: https://orgspace.tashan.chat,http://127.0.0.1:4173
    ports:
      - "127.0.0.1:${ORGSPACE_LOCAL_S3_PORT:-59000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - minio-data:/data

  minio-bootstrap:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - ./minio:/config:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/orgspace-files
        mc anonymous set none local/orgspace-files
        mc admin user add local "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" || true
        mc admin policy create local orgspace-app /config/app-policy.json || true
        mc admin policy attach local orgspace-app --user "$S3_ACCESS_KEY_ID"

volumes:
  postgres-data:
  redis-data:
  minio-data:
