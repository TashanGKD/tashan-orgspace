name: tashan-orgspace-local

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: orgspace
      POSTGRES_PASSWORD: ${ORGSPACE_LOCAL_POSTGRES_PASSWORD:?set ORGSPACE_LOCAL_POSTGRES_PASSWORD}
      POSTGRES_USER: orgspace
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgspace -d orgspace"]
      interval: 2s
      timeout: 3s
      retries: 15
    stop_grace_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    stop_grace_period: 10s
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
