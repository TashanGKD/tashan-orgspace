name: tashan-orgspace-prod

x-runtime-build: &runtime-build
  context: ..
  dockerfile: deploy/Dockerfile.runtime

x-database-url: &database-url postgresql://orgspace:${ORGSPACE_POSTGRES_PASSWORD:?ORGSPACE_POSTGRES_PASSWORD is required}@postgres:5432/orgspace

services:
  postgres:
    image: m.daocloud.io/docker.io/library/postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orgspace
      POSTGRES_PASSWORD: ${ORGSPACE_POSTGRES_PASSWORD:?ORGSPACE_POSTGRES_PASSWORD is required}
      POSTGRES_USER: orgspace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgspace -d orgspace"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: m.daocloud.io/docker.io/library/redis:8.2.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 20s
    volumes:
      - redis-data:/data

  migrate:
    build: *runtime-build
    command: ["pnpm", "--filter", "@tashan/api", "db:migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *database-url

  api:
    build: *runtime-build
    command: ["pnpm", "--filter", "@tashan/api", "start"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:?ALIYUN_SMS_ACCESS_KEY_ID is required}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:?ALIYUN_SMS_ACCESS_KEY_SECRET is required}
      ALIYUN_SMS_ENDPOINT: ${ALIYUN_SMS_ENDPOINT:?ALIYUN_SMS_ENDPOINT is required}
      ALIYUN_SMS_REGION_ID: ${ALIYUN_SMS_REGION_ID:?ALIYUN_SMS_REGION_ID is required}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:?ALIYUN_SMS_SIGN_NAME is required}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:?ALIYUN_SMS_TEMPLATE_CODE is required}
      ALIYUN_SMS_TEMPLATE_PARAM_KEY: ${ALIYUN_SMS_TEMPLATE_PARAM_KEY:?ALIYUN_SMS_TEMPLATE_PARAM_KEY is required}
      CORS_ORIGINS: https://orgspace.tashan.chat
      DATABASE_URL: *database-url
      HOST: 0.0.0.0
      JWT_ACTIVE_KEY_ID: ${JWT_ACTIVE_KEY_ID:?JWT_ACTIVE_KEY_ID is required}
      JWT_AUDIENCE: tashan-orgspace
      JWT_ISSUER: https://orgspace.tashan.chat
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      NODE_ENV: production
      PHONE_CODE_PEPPER: ${PHONE_CODE_PEPPER:?PHONE_CODE_PEPPER is required}
      PHONE_PROVIDER: aliyun
      PORT: "4110"
      REDIS_URL: redis://redis:6379
      SERVICE_VERSION: ${SERVICE_VERSION:?SERVICE_VERSION is required}
      TRUSTED_PROXY_CIDRS: 172.31.64.0/24
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4110/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      default:
        ipv4_address: 172.31.64.20
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    build: *runtime-build
    command: ["pnpm", "--filter", "@tashan/worker", "start"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *database-url
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.31.64.10
    ports:
      - "127.0.0.1:44110:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=0755
      - /var/run:size=4m,uid=101,gid=101,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres-data:
  redis-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.64.0/24
