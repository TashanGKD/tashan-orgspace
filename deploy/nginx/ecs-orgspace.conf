server {
  listen 80;
  listen [::]:80;
  server_name orgspace.tashan.chat;
  return 308 https://orgspace.tashan.chat$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name orgspace-files.tashan.chat;
  return 308 https://orgspace-files.tashan.chat$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name orgspace-files.tashan.chat;

  ssl_certificate /etc/ssl/wildcard-tashan/fullchain.cer;
  ssl_certificate_key /etc/ssl/wildcard-tashan/tashan.chat.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_connect_timeout 10s;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_pass http://127.0.0.1:14010;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name orgspace.tashan.chat;

  ssl_certificate /etc/ssl/wildcard-tashan/fullchain.cer;
  ssl_certificate_key /etc/ssl/wildcard-tashan/tashan.chat.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 2m;
  proxy_connect_timeout 5s;
  proxy_read_timeout 65s;
  proxy_send_timeout 65s;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_pass http://127.0.0.1:14010;
  }
}
